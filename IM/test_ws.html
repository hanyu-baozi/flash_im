<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket 测试工具</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); overflow: hidden; }
    .header { background: #4CAF50; color: white; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { font-size: 18px; font-weight: 600; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 13px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff4444; }
    .status-dot.connected { background: #4CAF50; }
    .controls { padding: 16px 20px; border-bottom: 1px solid #eee; display: flex; gap: 8px; }
    .controls input { flex: 1; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; }
    .controls input:focus { border-color: #4CAF50; }
    .controls button { padding: 10px 16px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500; }
    .btn-send { background: #4CAF50; color: white; }
    .btn-send:hover { background: #45a049; }
    .btn-clear { background: #f5f5f5; color: #666; }
    .btn-clear:hover { background: #e0e0e0; }
    .btn-connect { background: #2196F3; color: white; }
    .btn-connect:hover { background: #1976D2; }
    .btn-disconnect { background: #ff4444; color: white; }
    .btn-disconnect:hover { background: #cc0000; }
    .messages { padding: 16px 20px; height: 300px; overflow-y: auto; background: #fafafa; }
    .message { padding: 8px 12px; margin-bottom: 8px; border-radius: 8px; font-size: 14px; word-break: break-all; }
    .message.system { background: #e3f2fd; color: #1565c0; }
    .message.sent { background: #e8f5e9; color: #2e7d32; }
    .message.received { background: #fff3e0; color: #e65100; }
    .message.error { background: #fce4ec; color: #c62828; }
    .message .time { font-size: 11px; opacity: 0.6; margin-right: 8px; }
    .url-bar { padding: 12px 20px; border-bottom: 1px solid #eee; display: flex; gap: 8px; align-items: center; }
    .url-bar label { font-size: 13px; color: #666; white-space: nowrap; }
    .url-bar input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>WebSocket 测试工具</h1>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">未连接</span>
      </div>
    </div>
    <div class="url-bar">
      <label>地址:</label>
      <input type="text" id="urlInput" value="ws://localhost:3000/ws">
      <button class="btn-connect" id="connectBtn" onclick="connect()">连接</button>
      <button class="btn-disconnect" id="disconnectBtn" onclick="disconnect()" style="display:none;">断开</button>
    </div>
    <div class="controls">
      <input type="text" id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')send()">
      <button class="btn-send" onclick="send()">发送</button>
      <button class="btn-clear" onclick="clearLog()">清空</button>
    </div>
    <div class="messages" id="messages"></div>
  </div>

  <script>
    let ws = null;

    function getTime() {
      return new Date().toLocaleTimeString();
    }

    function addMessage(type, text) {
      const div = document.createElement('div');
      div.className = 'message ' + type;
      div.innerHTML = '<span class="time">' + getTime() + '</span>' + text;
      document.getElementById('messages').appendChild(div);
      document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function updateStatus(connected) {
      document.getElementById('statusDot').className = 'status-dot' + (connected ? ' connected' : '');
      document.getElementById('statusText').textContent = connected ? '已连接' : '未连接';
      document.getElementById('connectBtn').style.display = connected ? 'none' : 'inline-block';
      document.getElementById('disconnectBtn').style.display = connected ? 'inline-block' : 'none';
    }

    function connect() {
      if (ws) ws.close();
      const url = document.getElementById('urlInput').value.trim();
      addMessage('system', '正在连接 ' + url + '...');
      try {
        ws = new WebSocket(url);
        ws.onopen = () => {
          addMessage('system', '连接成功');
          updateStatus(true);
        };
        ws.onmessage = (e) => addMessage('received', e.data);
        ws.onclose = () => {
          addMessage('system', '连接已关闭');
          updateStatus(false);
        };
        ws.onerror = () => addMessage('error', '连接错误');
      } catch (e) {
        addMessage('error', '错误: ' + e.message);
      }
    }

    function disconnect() {
      if (ws) ws.close();
    }

    function send() {
      const input = document.getElementById('msgInput');
      const msg = input.value.trim();
      if (!msg) return;
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        addMessage('error', '未连接，无法发送');
        return;
      }
      ws.send(msg);
      addMessage('sent', msg);
      input.value = '';
    }

    function clearLog() {
      document.getElementById('messages').innerHTML = '';
    }
  </script>
</body>
</html>
