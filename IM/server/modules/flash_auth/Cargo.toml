[package]
name = "flash_auth"
version = "0.1.0"
edition = "2021"
description = "Flash IM authentication module"

[dependencies]
axum = "0.5"
tokio = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonwebtoken = "9"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "chrono"] }
bcrypt = "0.16"